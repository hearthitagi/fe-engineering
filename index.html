<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="12 周，只学三件事：pnpm workspace、Vite 8、GitHub Actions。每章都有可跟做的实操、故障演练和验收标准。" />
  <title>前端工程化实操教程</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./assets/docsify/vue.css" />
  <style>
    :root {
      --theme-color: #2563eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .sidebar .app-name-link {
      font-weight: 700;
    }

    .sidebar-nav > ul > li > p > strong {
      display: inline-block;
      margin: 1.1em 0 0.35em;
      color: #6b7280;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sidebar-nav a {
      line-height: 1.55;
    }

    .content {
      max-width: 920px;
    }

    .markdown-section {
      font-size: 16px;
      line-height: 1.78;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      letter-spacing: 0.01em;
    }

    .markdown-section code {
      border-radius: 4px;
    }

    .markdown-section pre > code {
      font-size: 0.86em;
      line-height: 1.65;
    }

    .markdown-section .mermaid {
      overflow-x: auto;
      text-align: center;
    }

    @media screen and (max-width: 768px) {
      .content {
        padding: 0 18px;
      }

      .markdown-section {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="app">正在加载教程……</div>

  <!-- Mermaid 负责把教程里的 ```mermaid 代码块渲染成图。 -->
  <script src="./assets/docsify/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      securityLevel: "loose"
    });

    window.$docsify = {
      name: "前端工程化实操教程",
      repo: "hearthitagi/fe-engineering",
      homepage: "README.md",
      loadSidebar: true,
      // 左侧只显示章节级目录；章节内的 H2 不再往下缩进一层。
      subMaxLevel: 0,
      auto2top: true,
      // 所有子目录共用根目录的一份侧边栏。
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md"
      },
      search: {
        placeholder: "搜索教程…",
        noData: "没有找到结果",
        depth: 3
      },
      mermaidConfig: {
        querySelector: ".mermaid"
      }
    };
  </script>
  <script src="./assets/docsify/docsify-mermaid.js"></script>
  <script src="./assets/docsify/docsify.min.js"></script>
  <script src="./assets/docsify/search.min.js"></script>
</body>
</html>
